name: Resume Versioning Tests

on:
  push:
    branches:
      - main
      - feat/resume-versioning
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Resume Version Service tests
        run: node backend/services/resumeVersionService.test.js
